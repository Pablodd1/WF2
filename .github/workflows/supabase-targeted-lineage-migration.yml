name: Apply private seller-lineage schema

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_PRIVATE_LINEAGE_SCHEMA to continue
        required: true
        type: string

concurrency:
  group: supabase-targeted-lineage-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'APPLY_PRIVATE_LINEAGE_SCHEMA' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PGPASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version

      - name: Build allowlisted transaction
        shell: bash
        run: |
          set -euo pipefail
          first="supabase/migrations/20260720220000_seller_listing_lineage_staging.sql"
          second="supabase/migrations/20260721120000_seller_child_lineage_staging.sql"
          test -f "$first"
          test -f "$second"
          {
            printf 'BEGIN;\n'
            cat "$first"
            printf '\n'
            cat "$second"
            printf '\nCOMMIT;\n'
          } > /tmp/private-lineage-schema.sql

      - name: Apply allowlisted private schema
        shell: bash
        run: |
          set -euo pipefail
          psql \
            "host=db.${SUPABASE_PROJECT_REF}.supabase.co port=5432 dbname=postgres user=postgres sslmode=require" \
            --set=ON_ERROR_STOP=1 \
            --file=/tmp/private-lineage-schema.sql

      - name: Verify private tables, RLS, and privileges
        shell: bash
        run: |
          set -euo pipefail
          db_url="host=db.${SUPABASE_PROJECT_REF}.supabase.co port=5432 dbname=postgres user=postgres sslmode=require"
          result="$(psql "$db_url" \
            --set=ON_ERROR_STOP=1 \
            --tuples-only --no-align \
            --command="SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('seller_listing_lineage_staging', 'seller_child_lineage_staging');")"
          test "$result" = "2"

          public_access="$(psql "$db_url" \
            --set=ON_ERROR_STOP=1 \
            --tuples-only --no-align \
            --command="WITH tables(table_name) AS (VALUES ('seller_listing_lineage_staging'::text), ('seller_child_lineage_staging'::text)) SELECT count(*) FROM tables WHERE has_table_privilege('anon', format('public.%s', table_name), 'SELECT') OR has_table_privilege('authenticated', format('public.%s', table_name), 'SELECT');")"
          test "$public_access" = "0"

          rls_disabled="$(psql "$db_url" \
            --set=ON_ERROR_STOP=1 \
            --tuples-only --no-align \
            --command="SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relname IN ('seller_listing_lineage_staging', 'seller_child_lineage_staging') AND c.relrowsecurity IS NOT TRUE;")"
          test "$rls_disabled" = "0"

          service_role_select="$(psql "$db_url" \
            --set=ON_ERROR_STOP=1 \
            --tuples-only --no-align \
            --command="WITH tables(table_name) AS (VALUES ('seller_listing_lineage_staging'::text), ('seller_child_lineage_staging'::text)) SELECT count(*) FROM tables WHERE has_table_privilege('service_role', format('public.%s', table_name), 'SELECT');")"
          test "$service_role_select" = "2"

          psql "$db_url" \
            --set=ON_ERROR_STOP=1 \
            --command="SELECT table_name, grantee, privilege_type FROM information_schema.role_table_grants WHERE table_schema = 'public' AND table_name IN ('seller_listing_lineage_staging', 'seller_child_lineage_staging') ORDER BY table_name, grantee, privilege_type;"
